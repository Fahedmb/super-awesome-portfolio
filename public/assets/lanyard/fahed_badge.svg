    <text x="432" y="16" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#FFFFFF" fill-opacity="0.4">HASH: SHA256//F4H3D98A</text>
    <text x="432" y="30" text-anchor="end" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#00E5FF">AUTHENTICATED // 2026</text>
